# Релиз: самодостаточные сборки под Windows, Linux, macOS и APK для Android.
#
# Запуск — по тегу (v1.0.0) или вручную из вкладки Actions. Перед публикацией обязательно
# проходит проверка проекта (check.sh): релиз не собирается из красного коммита.
# Файлы складываются в релиз на GitHub; тег создаёт тот, кто запускает (gh release create).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v1.0.0'
        required: true
        default: 'v0.1.0'
      draft:
        description: 'Черновик релиза (можно проверить файлы до публикации)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Проверка перед релизом
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Проверка проекта
        run: |
          chmod +x ./check.sh
          ./check.sh

  desktop:
    name: ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Публикация ${{ matrix.rid }}
        run: >-
          dotnet publish src/GoEngine.App/GoEngine.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:DebugType=none -p:DebugSymbols=false
          -o publish/${{ matrix.rid }}

      - name: Проверка запуска (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          ./publish/${{ matrix.rid }}/GoEngine.App.exe --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Проверочный режим не прошёл.' }

      - name: Проверка запуска (Linux, macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          chmod +x ./publish/${{ matrix.rid }}/GoEngine.App
          ./publish/${{ matrix.rid }}/GoEngine.App --smoke

      - name: Упаковка (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "go-engine-${{ matrix.rid }}-$env:TAG"
          Compress-Archive -Path "./publish/${{ matrix.rid }}/*" -DestinationPath "$name.zip"
          Write-Host "собрано: $name.zip"

      - name: Упаковка (Linux, macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          name="go-engine-${{ matrix.rid }}-${TAG}"
          tar -czf "$name.tar.gz" -C "publish/${{ matrix.rid }}" .
          ls -lh "$name.tar.gz"

      - name: Выгрузка сборки
        uses: actions/upload-artifact@v4
        with:
          name: go-engine-${{ matrix.rid }}
          path: |
            go-engine-${{ matrix.rid }}-${{ env.TAG }}.zip
            go-engine-${{ matrix.rid }}-${{ env.TAG }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  android:
    name: android (APK)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Установка рабочей нагрузки Android
        run: dotnet workload install android
      - name: Публикация APK
        run: >-
          dotnet publish src/GoEngine.App.Android/GoEngine.App.Android.csproj
          -c Release -f net8.0-android -o publish/android
      - name: Выгрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: go-engine-android
          path: publish/android/**/*.apk
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Публикация релиза
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сбор файлов релиза
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Список файлов
        run: find dist -type f | sort
      - name: Создание релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            flags="--draft"
          fi
          mapfile -t files < <(find dist -type f | sort)
          printf 'файлов в релизе: %s\n' "${#files[@]}"
          gh release create "${TAG}" "${files[@]}" \
            --title "Go Engine ${TAG}" \
            --generate-notes \
            $flags
