# Версионированный релиз: самодостаточные сборки под Windows, Linux, macOS и APK для Android.
#
# Запуск — по тегу (v1.0.0) или вручную из вкладки Actions. Перед публикацией обязательно
# проходит проверка проекта (check.sh): релиз не собирается из красного коммита.
# Сами сборки делает общий workflow build.yml — тот же, что наполняет плавающий релиз latest,
# поэтому шаги сборки описаны в одном месте. Здесь остаётся проверка и публикация вехи.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v0.2.0. Существующий релиз обновляется, новый создаётся'
        required: true
      draft:
        description: 'Оставить черновиком (файлы не будут видны для скачивания до публикации)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Проверка перед релизом
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Проверка проекта
        run: |
          chmod +x ./check.sh
          ./check.sh

  build:
    name: Сборки
    needs: verify
    uses: ./.github/workflows/build.yml
    # Секреты обязаны передаваться явно: в переиспользуемом workflow контекст secrets пуст.
    secrets: inherit
    with:
      # Имя архива с версией: go-engine-win-x64-v0.1.0.zip
      suffix: -${{ inputs.tag || github.ref_name }}

  publish:
    name: Публикация релиза
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Сбор файлов релиза
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Список файлов
        run: find dist -type f | sort
      - name: Создание или обновление релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            flags="--draft"
          fi
          mapfile -t files < <(find dist -type f | sort)
          printf 'файлов в релизе: %s\n' "${#files[@]}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Релиз для этого тега уже есть: обновляем файлы, а не падаем с «already exists».
            # Так повторный запуск на существующем теге безопасен и перезапускаем.
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" \
              --title "Go Engine ${TAG}" \
              --generate-notes \
              $flags
          fi
