# Непрерывная проверка: та же команда, что и локально (check.sh / check.ps1).
# Проверочные режимы приложения не открывают окно, поэтому агент без графической сессии
# проходит их целиком. Две системы — потому что приложение настольное: сборка под Windows
# и под Linux ломается по-разному.
#
# Здесь только проверки: они быстрые и должны падать раньше сборок. Сборка настольных
# платформ и APK живёт в build.yml и запускается из latest.yml (плавающий релиз latest)
# и из release.yml (версионированный релиз) — шаги сборки описаны в одном месте.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux — сборка, тесты, режимы
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      # Шаги разделены намеренно: если проверка падает, в списке шагов видно, что именно —
      # сборка, тесты или режимы приложения. Одна команда ./check.sh прятала это в общем выводе
      # (сбой CI #126 2026-10-15: сообщение было только «exit code 1»).
      - name: Сборка решения
        run: dotnet build src/GoEngine.sln --nologo
      - name: Тесты решения
        run: dotnet test src/GoEngine.sln --nologo
      - name: Проверочные режимы приложения
        run: |
          for mode in --smoke --check --state --settings --sgf --animation --problems --result --territory --clock --update --e2e --stress; do
            echo "Go Engine: режим $mode"
            dotnet run --project src/GoEngine.App.Desktop/GoEngine.App.Desktop.csproj --no-build -- "$mode" || exit 1
          done

  windows:
    name: Windows — сборка и тесты
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Проверка проекта
        shell: pwsh
        run: ./check.ps1 -SkipStress
