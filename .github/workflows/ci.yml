# Непрерывная проверка: та же команда, что и локально (check.sh / check.ps1).
# Проверочные режимы приложения не открывают окно, поэтому агент без графической сессии
# проходит их целиком. Две системы — потому что приложение настольное: сборка под Windows
# и под Linux ломается по-разному.
#
# Здесь только проверки: они быстрые и должны падать раньше сборок. Сборка настольных
# платформ и APK живёт в build.yml и запускается из latest.yml (плавающий релиз latest)
# и из release.yml (версионированный релиз) — шаги сборки описаны в одном месте.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux — сборка, тесты, режимы
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Проверка проекта
        run: |
          chmod +x ./check.sh
          ./check.sh

  windows:
    name: Windows — сборка и тесты
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Проверка проекта
        shell: pwsh
        run: ./check.ps1 -SkipStress
