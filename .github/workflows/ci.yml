# Непрерывная проверка: та же команда, что и локально (check.sh).
# Проверочные режимы приложения не открывают окно, поэтому агент без графической сессии
# проходит их целиком. Публичное зеркало появится — workflow заработает без правок.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Сборка, тесты и режимы приложения
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Проверка проекта
        run: |
          chmod +x ./check.sh
          ./check.sh
