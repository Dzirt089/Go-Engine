# Общая сборка артефактов: четыре настольные платформы и APK для Android.
#
# Вызывается из двух мест, чтобы шаги сборки не дублировались:
#   latest.yml  — на каждый push в main, файлы уходят в плавающий релиз latest;
#   release.yml — по тегу или вручную, файлы уходят в версионированный релиз.
# Вход suffix добавляет версию к именам архивов (например, -v0.1.0); для latest он пустой,
# поэтому ссылки в плавающем релизе постоянные.
name: Build artifacts

on:
  workflow_call:
    inputs:
      suffix:
        description: 'Суффикс имени архива, например -v0.1.0. Пусто — имя без версии'
        type: string
        required: false
        default: ''
      version:
        description: 'Версия выпуска, например 0.2.15: попадает внутрь сборок. Пусто — версия по умолчанию'
        type: string
        required: false
        default: ''
      version_code:
        description: 'Номер версии Android (versionCode), целое и только растущее. Пусто — значение проекта'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  desktop:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Версия попадает внутрь сборки: приложение показывает её игроку и по ней решает,
      # нужен ли выпуск из манифеста обновления.
      - name: Публикация ${{ matrix.rid }}
        run: >-
          dotnet publish src/GoEngine.App.Desktop/GoEngine.App.Desktop.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:DebugType=none -p:DebugSymbols=false
          -p:OfficialBuild=true
          ${{ inputs.version != '' && format('-p:Version={0}', inputs.version) || '' }}
          -o publish/${{ matrix.rid }}

      # Модели кладём в сборку рядом с приложением: приложение ищет каталог models вверх от своего
      # исполняемого файла, поэтому после распаковки архива уровни с нейросетью работают сразу.
      # Файлы берём из нашего релиза models-v1 (он публичный), а не с внешнего хостинга: сборка
      # не зависит от чужой доступности. Хеш проверяем — иначе в релиз уйдёт битая поставка.
      - name: Модели нейросети в сборку
        shell: pwsh
        env:
          MODELS_TAG: models-v1
        run: |
          $dir = "./publish/${{ matrix.rid }}/models"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $models = @(
            @{ Name = 'kata1-b28c512nbt-adam-s11165M-d5387M.uint8.onnx'; Sha = 'D9EA9DB19C59F3934EF566ABB8D296B3E94A22916A88352810499D02C88C5828' },
            @{ Name = 'kata9x9-finetuned.uint8.onnx'; Sha = '4EF793FFC3CA9C4FDD5D95F186C3A411129F2A707977227A2262C9F599D3C163' }
          )
          foreach ($model in $models) {
            $url = "https://github.com/Dzirt089/Go-Engine/releases/download/$env:MODELS_TAG/$($model.Name)"
            $path = Join-Path $dir $model.Name
            Write-Host "качаю модель: $($model.Name)"
            Invoke-WebRequest -Uri $url -OutFile $path -UseBasicParsing
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash
            if ($hash -ne $model.Sha) {
              throw "SHA-256 не совпал: $($model.Name). Ожидался $($model.Sha), получен $hash"
            }
            $size = [math]::Round((Get-Item $path).Length / 1MB, 1)
            Write-Host "модель на месте: $($model.Name), $size МБ, SHA-256 сходится"
          }

      - name: Проверка запуска (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          # Приложение — GUI-процесс: PowerShell не ждёт его и не выставляет $LASTEXITCODE,
          # поэтому запускаем через Start-Process и смотрим код возврата сами.
          $process = Start-Process -FilePath "./publish/${{ matrix.rid }}/GoEngine.App.Desktop.exe" -ArgumentList '--smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Проверочный режим не прошёл: код $($process.ExitCode)." }

      # Версия внутри собранной программы: её видит игрок и по ней приложение решает, нужен ли
      # выпуск из манифеста. Читаем прямо из exe — иначе расхождение (например, забытый -p:Version)
      # обнаружится только на машине игрока.
      - name: Проверка версии в сборке (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $exe = "./publish/${{ matrix.rid }}/GoEngine.App.Desktop.exe"
          $product = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "ProductVersion сборки: $product"
          if (-not $env:EXPECTED_VERSION) { Write-Host 'версия выпуска не задана (проверка CI) — сверять не с чем'; exit 0 }
          if ($product -notlike "$($env:EXPECTED_VERSION)*") {
            throw "Версия в сборке не совпала: ожидалась $($env:EXPECTED_VERSION), получена $product"
          }

      - name: Проверка запуска (Linux, macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          chmod +x ./publish/${{ matrix.rid }}/GoEngine.App.Desktop
          ./publish/${{ matrix.rid }}/GoEngine.App.Desktop --smoke

      # Установщик для Windows: ставит приложение целиком вместе с моделями, делает ярлыки и
      # деинсталлятор. Модели уже лежат в публикации (шаг выше), поэтому отдельно их не качаем.
      # Inno Setup ставится только на агенте сборки — в проекте новых зависимостей не появляется.
      - name: Установщик (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { throw 'ISCC.exe не найден: Inno Setup не установился' }

          $suffix = '${{ inputs.suffix }}'
          $given = '${{ inputs.version }}'
          # Версию задаёт вызывающий (версионированный выпуск), иначе — тег или номер прогона.
          $version = if ($given) { $given } elseif ($suffix) { $suffix.TrimStart('-').TrimStart('v') } else { "0.1.${{ github.run_number }}" }

          & $iscc "/DMyVersion=$version" "/DMySuffix=$suffix" "/DSourceDir=$PWD/publish/${{ matrix.rid }}" "/DModelsDir=$PWD/publish/${{ matrix.rid }}/models" installer/goengine.iss 2>&1 | Tee-Object -FilePath installer-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Установщик не собрался' }

          $setup = Get-ChildItem dist-installer/GoEngine-Setup*.exe | Select-Object -First 1
          if (-not $setup) { throw 'Файл установщика не появился' }

          # Проверяем по журналу компиляции, что внутри и приложение, и обе модели: иначе
          # установщик может собраться «успешно», но без сетей.
          $appInside = (Select-String -Path installer-build.log -Pattern 'GoEngine\.App\.Desktop\.exe' | Measure-Object).Count
          $modelsInside = (Select-String -Path installer-build.log -Pattern 'models' | Measure-Object).Count
          Write-Host "внутри установщика: приложение $appInside, моделей $modelsInside"
          if ($appInside -lt 1) { throw 'В установщик не попало приложение' }
          if ($modelsInside -lt 2) { throw "В установщик не попали модели (совпадений $modelsInside)" }

          Write-Host "установщик: $($setup.Name) — $([math]::Round($setup.Length / 1MB, 1)) МБ"
          Move-Item $setup.FullName "GoEngine-Setup$suffix.exe"
      - name: Упаковка (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "go-engine-${{ matrix.rid }}${{ inputs.suffix }}"
          Compress-Archive -Path "./publish/${{ matrix.rid }}/*" -DestinationPath "$name.zip"
          Write-Host "собрано: $name.zip"

      - name: Упаковка (Linux, macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          name="go-engine-${{ matrix.rid }}${{ inputs.suffix }}"
          tar -czf "$name.tar.gz" -C "publish/${{ matrix.rid }}" .
          ls -lh "$name.tar.gz"

      - name: Выгрузка сборки
        uses: actions/upload-artifact@v4
        with:
          name: go-engine-${{ matrix.rid }}
          path: |
            go-engine-${{ matrix.rid }}${{ inputs.suffix }}.zip
            go-engine-${{ matrix.rid }}${{ inputs.suffix }}.tar.gz
            GoEngine-Setup${{ inputs.suffix }}.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Работаем из папки головы: там свой global.json с SDK восьмой полосы. На машине сборки
      # может стоять более новый SDK, а для него рабочая нагрузка net8.0-android объявлена
      # вне поддержки — сборка падает, хотя сам проект в порядке.
      # На Android каталог рядом с приложением недоступен, поэтому модели кладутся внутрь пакета
      # как assets/models: при первом запуске приложение копирует их в свой файловый каталог
      # (AndroidModelStartup). Файлы берём из нашего релиза models-v1 и сверяем SHA-256 —
      # иначе в пакет уедет битая модель, и это выяснится только на телефоне.
      - name: Модели нейросети в пакет
        env:
          MODELS_TAG: models-v1
        run: |
          mkdir -p models
          declare -A hashes=(
            ["kata1-b28c512nbt-adam-s11165M-d5387M.uint8.onnx"]="d9ea9db19c59f3934ef566abb8d296b3e94a22916a88352810499d02c88c5828"
            ["kata9x9-finetuned.uint8.onnx"]="4ef793ffc3ca9c4fdd5d95f186c3a411129f2a707977227a2262c9f599d3c163"
          )
          for name in "${!hashes[@]}"; do
            url="https://github.com/Dzirt089/Go-Engine/releases/download/${MODELS_TAG}/${name}"
            echo "качаю модель: ${name}"
            curl -L --fail --silent --show-error -o "models/${name}" "$url"
            actual=$(sha256sum "models/${name}" | cut -d' ' -f1)
            if [ "$actual" != "${hashes[$name]}" ]; then
              echo "SHA-256 не совпал: ${name}: ожидался ${hashes[$name]}, получен ${actual}" >&2
              exit 1
            fi
            echo "модель на месте: ${name}, $(du -h "models/${name}" | cut -f1)"
          done

      - name: Установка рабочей нагрузки Android
        working-directory: src/GoEngine.App.Android
        run: dotnet workload install android
      # versionCode обязан расти от выпуска к выпуску: иначе Android откажется ставить обновление
      # поверх установленного приложения, даже если версия в пакете новее.
      - name: Публикация APK
        working-directory: src/GoEngine.App.Android
        run: >-
          dotnet publish GoEngine.App.Android.csproj
          -c Release -f net8.0-android34.0 -o ../../publish/android
          -p:OfficialBuild=true
          ${{ inputs.version != '' && format('-p:Version={0}', inputs.version) || '' }}
          ${{ inputs.version != '' && format('-p:ApplicationDisplayVersion={0}', inputs.version) || '' }}
          ${{ inputs.version_code != '' && format('-p:ApplicationVersion={0}', inputs.version_code) || '' }}
      # Проверка содержимого пакета: APK — это zip, смотрим файлы и версию. Модели без нативной
      # библиотеки ONNX бесполезны, а версия без номера выпуска выглядит на телефоне как «0.1.0»,
      # поэтому проверяем и то, и другое, и третье, а не только наличие .onnx.
      - name: Проверка содержимого APK
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_CODE: ${{ inputs.version_code }}
        run: |
          apk=$(find publish/android -name '*.apk' | head -n 1)
          echo "пакет: ${apk} ($(du -h "${apk}" | cut -f1))"
          listing=$(unzip -l "${apk}" | grep 'assets/models/' || true)
          echo "${listing}"
          count=$(echo "${listing}" | grep -c '\.onnx' || true)
          if [ "${count}" -lt 2 ]; then
            echo "в APK нет моделей: найдено ${count} файлов .onnx" >&2
            exit 1
          fi
          echo "моделей в пакете: ${count}"

          # Нативная библиотека ONNX: без неё модели в пакете не загрузятся, и на телефоне это
          # выглядит ровно как «модели недоступны».
          so=$(unzip -l "${apk}" | grep 'libonnxruntime.so' || true)
          echo "${so}"
          if [ -z "${so}" ]; then
            echo "в APK нет libonnxruntime.so: модели не загрузятся" >&2
            exit 1
          fi

          # Версия пакета: versionName обязан совпасть с версией выпуска, versionCode — с переданным.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt2=$(find "${sdk}/build-tools" -name aapt2 2>/dev/null | sort | tail -n 1)
          if [ -z "${aapt2}" ]; then
            echo "aapt2 не найден в ${sdk}: проверить версию пакета нечем" >&2
            exit 1
          fi
          badging=$("${aapt2}" dump badging "${apk}")
          name=$(echo "${badging}" | grep -o "versionName='[^']*'" | head -n 1 | cut -d"'" -f2)
          code=$(echo "${badging}" | grep -o "versionCode='[^']*'" | head -n 1 | cut -d"'" -f2)
          echo "версия пакета: versionName='${name}', versionCode='${code}'"
          if [ -n "${EXPECTED_VERSION}" ] && [ "${name}" != "${EXPECTED_VERSION}" ]; then
            echo "versionName не совпал: ожидался ${EXPECTED_VERSION}, получен ${name}" >&2
            exit 1
          fi
          if [ -n "${EXPECTED_CODE}" ] && [ "${code}" != "${EXPECTED_CODE}" ]; then
            echo "versionCode не совпал: ожидался ${EXPECTED_CODE}, получен ${code}" >&2
            exit 1
          fi
      - name: Выгрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: go-engine-android
          path: publish/android/**/*.apk
          if-no-files-found: error
          retention-days: 14
