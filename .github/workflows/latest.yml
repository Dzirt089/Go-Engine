# Версионированные выпуски и плавающий релиз latest: свежие сборки из main.
#
# Два канала, потому что у них разные задачи:
#   v<версия> — неизменяемый выпуск: по его ссылкам приложение скачивает обновление,
#               и файл не подменится под руками у игрока;
#   latest    — постоянные адреса: приложение знает заранее, где искать манифест обновления
#               (releases/download/latest/update.json), а не переписывается под каждый выпуск.
#
# Версия — 0.2.<номер прогона>. Номер прогона в GitHub только растёт, поэтому тег не повторяется
# и не понижается; повторный запуск на том же прогоне перезаписывает свои же файлы (--clobber),
# то есть workflow идемпотентен.
name: Latest build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Версия выпуска
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - name: Вычисление версии
        id: v
        run: |
          version="0.2.${{ github.run_number }}"
          # versionCode для Android — тот же номер прогона: целое и только растущее.
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "выпуск: v${version}"

  build:
    name: Сборки
    needs: [version]
    uses: ./.github/workflows/build.yml
    # Секреты обязаны передаваться явно: в переиспользуемом workflow контекст secrets пуст,
    # и без этого ключ подписи Android не доезжал до сборки.
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      version_code: ${{ needs.version.outputs.code }}

  publish:
    name: Публикация выпуска и latest
    needs: [build, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # gh определяет репозиторий по git-каталогу, поэтому checkout здесь обязателен:
      # без него команды gh падают с «not a git repository», хотя файлы уже собраны.
      - uses: actions/checkout@v5

      - name: Сбор файлов
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Манифест обновления
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          # Неподписанный APK в выпуск не идёт: Android его не поставит, а игрок может скачать
          # именно его и получить «подпись пакета и установленного приложения не совпадают».
          # Раздаётся только подписанный пакет (его же выбирает манифест обновлений).
          find dist -name '*.apk' ! -name '*-Signed.apk' -delete
          find dist -type f | sort
          python3 .github/scripts/make-update-manifest.py dist
          echo "--- update.json ---"
          cat dist/update.json

      - name: Публикация версионированного выпуска
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          notes="Версия ${{ needs.version.outputs.version }}, коммит ${{ github.sha }}. Прогон: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          mapfile -t files < <(find dist -type f | sort)
          printf 'файлов в выпуске: %s\n' "${#files[@]}"
          # Ассеты удаляем явно: gh release upload --clobber на существующем релизе отдаёт
          # «ReleaseAsset.name already exists» и роняет публикацию (проверено на latest).
          # Цикл вписан в каждый шаг: shell у шагов свой, функция из соседнего шага не видна.
          if gh release view "$TAG" >/dev/null 2>&1; then
            for path in "${files[@]}"; do
              gh release delete-asset "$TAG" "$(basename "$path")" --yes >/dev/null 2>&1 || true
            done
            gh release upload "$TAG" "${files[@]}"
          else
            # latest=false: «самым свежим» остаётся плавающий релиз, у версии своя жизнь.
            gh release create "$TAG" "${files[@]}" \
              --title "Go Engine $TAG" \
              --notes "$notes" \
              --latest=false
          fi

      - name: Обновление плавающего релиза latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Свежая сборка (main), версия ${{ needs.version.outputs.version }}"
          notes="Версия ${{ needs.version.outputs.version }}, коммит ${{ github.sha }}. Прогон: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          mapfile -t files < <(find dist -type f | sort)
          printf 'файлов в релизе: %s\n' "${#files[@]}"
          if gh release view latest >/dev/null 2>&1; then
            # Релиз latest уже есть: обновляем файлы и заметки, чтобы ссылка осталась прежней.
            for path in "${files[@]}"; do
              gh release delete-asset latest "$(basename "$path")" --yes >/dev/null 2>&1 || true
            done
            gh release upload latest "${files[@]}"
            gh release edit latest --title "$title" --notes "$notes" --latest
          else
            gh release create latest "${files[@]}" --title "$title" --notes "$notes" --latest
          fi
